spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/oyla}
    username: ${DATABASE_USER:oyla}
    password: ${DATABASE_PASSWORD:oyla_local_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
server:
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
oyla:
  youtube:
    api-key: ${YOUTUBE_API_KEY:}
  mail:
    from: ${MAIL_FROM:no-reply@omirai.example}
  auth:
    pepper: ${AUTH_PEPPER:local-development-pepper-change-me}
    expose-code: ${AUTH_EXPOSE_CODE:false}
    code-minutes: 10
    access-minutes: 15
    refresh-days: 30

omirai:
  family:
    delivery-enabled: ${OMIRAI_FAMILY_DELIVERY_ENABLED:false}
    public-url: ${OMIRAI_PUBLIC_URL:}
