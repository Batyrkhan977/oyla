services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: oyla
      POSTGRES_USER: oyla
      POSTGRES_PASSWORD: oyla_local_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oyla"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
